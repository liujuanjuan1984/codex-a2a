minimum_pre_commit_version: 4.5.1
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (uv)
        entry: uv run --locked --extra dev ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: ["--fix"]
      - id: ruff-format
        name: ruff format (uv)
        entry: uv run --locked --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
