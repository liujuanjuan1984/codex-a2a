name: Scheduled Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  a2a-tck:
    name: A2A Mandatory TCK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run pinned mandatory TCK
        env:
          CONFORMANCE_TCK_REF: 5996b79f9cefa6fc390980e383e358a66fb9e49e
        run: bash ./scripts/conformance.sh mandatory

      - name: Upload TCK evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a2a-tck-evidence
          path: run/conformance/
          if-no-files-found: error
          retention-days: 14

  live-codex:
    name: Latest Codex App Server Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Install latest stable Codex CLI
        run: npm install --global @openai/codex@latest

      - name: Verify real Codex app-server initialization
        run: bash ./scripts/smoke_test_live_codex.sh
